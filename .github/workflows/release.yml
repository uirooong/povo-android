name: Release APK

# Publishing a release builds the signed release APK and attaches it to that
# release, which is also where the in-app updater looks for it.
on:
  release:
    # `published` only. A release created without first being saved as a draft
    # fires BOTH `created` and `published`, which started two runs racing to
    # attach the same asset. `published` on its own still covers publishing a
    # draft and creating a release outright, and does not fire for a draft.
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach to'
        required: true

permissions:
  contents: write

# Belt and braces now that the double trigger is gone. Deliberately not
# cancel-in-progress: interrupting a run mid-upload could leave the release with
# a partial asset, so a second run waits instead.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # For a release event this is the tag; for a manual run it is the tag
          # given as input.
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Refuse to build unsigned
        # The signing config silently falls back to the debug key when no
        # keystore is configured, which is right locally and wrong here: a
        # release signed with a different key cannot upgrade an installed app,
        # so users would have to uninstall and lose their sessions. Fail before
        # building rather than publishing something unusable.
        env:
          KEYSTORE: ${{ secrets.POVO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.POVO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POVO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POVO_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ]       || missing="$missing POVO_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing POVO_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]      || missing="$missing POVO_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]   || missing="$missing POVO_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi

      - name: Make the Gradle wrapper executable
        # The repository is worked on from Windows, where git does not track the
        # executable bit — so gradlew can arrive here mode 644 and the runner
        # fails with "Permission denied" before Gradle is ever reached. The mode
        # is fixed in the index too; this is the guard against it regressing.
        run: chmod +x ./gradlew

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust with the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo and the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            povo-core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('povo-core/**/Cargo.lock', 'povo-core/**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install cargo-ndk
        run: cargo ndk --version || cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Point the build at the runner's SDK and NDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          NDK_DIR=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Decode the signing key
        # Written outside the workspace so it cannot be picked up by anything
        # that archives the checkout, and removed again at the end of the job.
        env:
          KEYSTORE: ${{ secrets.POVO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/povo-release.jks"
          echo "POVO_KEYSTORE_PATH=$RUNNER_TEMP/povo-release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          POVO_KEYSTORE_PASSWORD: ${{ secrets.POVO_KEYSTORE_PASSWORD }}
          POVO_KEY_ALIAS: ${{ secrets.POVO_KEY_ALIAS }}
          POVO_KEY_PASSWORD: ${{ secrets.POVO_KEY_PASSWORD }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          # The APK's own version has to match the tag it is published under,
          # or the in-app updater offers this release forever.
          ./gradlew :app:assembleRelease -Ppovo.abis=arm64-v8a,armeabi-v7a,x86_64 -Ppovo.versionName="${TAG#v}"

      - name: Test and lint
        # After the APK: the uniffi bindings the unit tests compile against are
        # generated by the Rust build, and skipping it here avoids a second one.
        run: ./gradlew test :app:lintDebug -Ppovo.skipRustBuild=true

      - name: Name the APK after the release
        id: apk
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          DEST="povo-manager-${TAG}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Report the version and signing fingerprint
        # Both are things whose failure mode is silent and only bites users. A
        # key rotation would be discovered by an upgrade being refused, and a
        # version that disagrees with the tag by the updater offering this
        # release over and over — so both are printed for the record.
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "${{ steps.apk.outputs.path }}" | head -1
          "$BT/apksigner" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Attach the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true

      - name: Shred the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/povo-release.jks"
