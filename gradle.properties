org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- povo-core (Rust) build wiring -------------------------------------
# ABIs to build the Rust core for. Debug builds default to a single ABI so the
# edit -> run loop stays fast; release builds always cover all three.
# Override per invocation:  ./gradlew :app:assembleDebug -Ppovo.abis=arm64-v8a,x86_64
povo.abis=arm64-v8a
# Cargo profile used for the Android .so ("release" or "debug").
povo.cargoProfile=release
# Set to true to skip the Rust build entirely (uses whatever is already in
# core-povo/build/generated). Useful when iterating on Kotlin only.
povo.skipRustBuild=false

# ---- AGP 9 built-in Kotlin -------------------------------------------
# KSP 2.2.10-2.0.2 (the version AGP 9.4.0 manages) still registers its
# generated sources through the kotlin.sourceSets DSL, which built-in Kotlin
# rejects by default. This is the documented suppression for that combination.
# Revisit once AGP ships a KSP that uses the android.sourceSets DSL.
android.disallowKotlinSourceSets=false

# Repository the in-app updater checks for releases, and where CI publishes
# them. Override in a fork rather than patching source.
povo.updateRepo=uirooong/povo-android
